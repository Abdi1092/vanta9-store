<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VANTA/9 – Streetwear for the night shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============ STAGE 1-2: STYLE (CSS) ============ */
:root{
  --bg:#0c0c0e; --panel:#151518; --line:#2a2a30; --bone:#eeeae2; --mute:#8d8d96;
  --uv:#7b5cff; --sale:#ff6a3d; color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--bone);font:16px/1.5 Archivo,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,.logo{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;font-weight:900;letter-spacing:.02em;margin:0}
:focus-visible{outline:2px solid var(--uv);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{font-size:28px;flex:1}
.logo span{color:var(--uv)}
.nav{display:flex;gap:4px;overflow-x:auto;max-width:1100px;margin:auto;padding:0 12px 8px;scrollbar-width:none}
.nav button{background:none;border:0;padding:6px 12px;border-radius:99px;color:var(--mute);white-space:nowrap}
.nav button.on{background:var(--bone);color:var(--bg)}
.nav button.sale.on{background:var(--sale)}
.icon{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#count{background:var(--uv);border-radius:99px;padding:0 7px;margin-left:6px;font-size:13px}

.hero{max-width:1100px;margin:auto;padding:56px 16px 32px}
.hero h1{font-size:clamp(52px,14vw,150px);line-height:.88;text-transform:uppercase}
.hero p{max-width:34ch;color:var(--mute);margin:18px 0 22px}
.cta{background:var(--bone);color:var(--bg);border:0;border-radius:6px;padding:12px 22px;font-weight:600}

.tools{max-width:1100px;margin:auto;padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{background:var(--panel);border:1px solid var(--line);color:var(--bone);border-radius:8px;padding:10px 12px;font-size:16px}
.tools input{flex:1;min-width:160px}
.chips{display:flex;gap:6px;width:100%}
.chips button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px}
.chips button.on{border-color:var(--uv);color:var(--uv)}

.grid{max-width:1100px;margin:auto;padding:8px 16px 48px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;text-align:left;padding:0}
.card:hover{border-color:var(--uv)}
.pic{aspect-ratio:1;display:grid;place-items:center;font-size:64px;position:relative}
.tag{position:absolute;top:8px;left:8px;background:var(--sale);color:#111;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px}
.info{padding:10px 12px 14px}
.info b{display:block;font-weight:600}
.info small{color:var(--mute)}
.was{color:var(--mute);text-decoration:line-through;margin-left:6px}
.empty{grid-column:1/-1;color:var(--mute);padding:40px 0}

/* modal + drawer */
.veil{position:fixed;inset:0;background:#000b;display:none;z-index:40}
.veil.open{display:block}
.sheet{position:fixed;background:var(--panel);border:1px solid var(--line);padding:18px;overflow:auto;z-index:41;display:none}
.sheet.open{display:block}
#modal{left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,92vw);max-height:88vh;border-radius:10px}
#drawer{right:0;top:0;bottom:0;width:min(400px,100vw);padding-top:calc(18px + env(safe-area-inset-top,0px))}
.sizes{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.sizes button{background:none;border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-width:48px}
.sizes button.on{background:var(--bone);color:var(--bg)}
.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line .t{flex:1}
.qty button{background:none;border:1px solid var(--line);border-radius:6px;width:30px;height:30px}
.total{display:flex;justify-content:space-between;font-size:20px;margin:16px 0}
.pay{width:100%;background:var(--uv);color:#fff;border:0;border-radius:6px;padding:14px;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bone);color:var(--bg);padding:10px 18px;border-radius:8px;display:none;z-index:60;max-width:90vw;text-align:center}
footer{border-top:1px solid var(--line);color:var(--mute);text-align:center;padding:24px 16px;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">VANTA<span>/9</span></div>
    <button class="icon" id="openCart" aria-label="Open cart">Cart<span id="count">0</span></button>
  </div>
  <nav class="nav" id="nav"></nav>
</header>

<section class="hero">
  <h1>Built for<br>the night shift</h1>
  <p>Heavy hoodies, quiet sneakers and gear that looks better after dark.</p>
  <button class="cta" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">Shop new drops</button>
</section>

<section id="shop">
  <div class="tools">
    <input id="q" type="search" placeholder="Search products" aria-label="Search products">
    <select id="sort" aria-label="Sort products">
      <option value="new">Newest</option>
      <option value="low">Price: low to high</option>
      <option value="high">Price: high to low</option>
    </select>
    <div class="chips" id="chips"></div>
  </div>
  <div class="grid" id="grid"></div>
</section>

<footer>VANTA/9 is a fictional brand made for learning web development.</footer>

<div class="veil" id="veil"></div>
<div class="sheet" id="modal" role="dialog" aria-modal="true"></div>
<div class="sheet" id="drawer" role="dialog" aria-modal="true"></div>
<div id="toast"></div>

<script>
/* ============ STAGE 3: PRODUCT DATA ============
   Every product is one object in this array. Add, edit or delete items
   here and the whole store updates by itself. */
const PRODUCTS = [
  {id:1, name:'Phantom Runner',   type:'Shoes',       gender:'Unisex', price:1290, icon:'👟', hue:260},
  {id:2, name:'Night Shift High', type:'Shoes',       gender:'Men',    price:1590, icon:'👟', hue:220, sale:true},
  {id:3, name:'Ash Slide',        type:'Shoes',       gender:'Women',  price:490,  icon:'🩴', hue:300},
  {id:4, name:'Glitch Trainer',   type:'Shoes',       gender:'Kids',   price:790,  icon:'👟', hue:160},
  {id:5, name:'Void Hoodie',      type:'Clothing',    gender:'Unisex', price:899,  icon:'🧥', hue:250},
  {id:6, name:'Static Tee',       type:'Clothing',    gender:'Men',    price:349,  icon:'👕', hue:200},
  {id:7, name:'Cargo Pants',      type:'Clothing',    gender:'Men',    price:749,  icon:'👖', hue:30,  sale:true},
  {id:8, name:'Crop Windbreaker', type:'Clothing',    gender:'Women',  price:849,  icon:'🧥', hue:330},
  {id:9, name:'Lowlight Leggings',type:'Clothing',    gender:'Women',  price:499,  icon:'👖', hue:280},
  {id:10,name:'Mini Hoodie',      type:'Clothing',    gender:'Kids',   price:499,  icon:'🧥', hue:190},
  {id:11,name:'Signal Cap',       type:'Accessories', gender:'Unisex', price:249,  icon:'🧢', hue:240},
  {id:12,name:'Blackout Beanie',  type:'Accessories', gender:'Unisex', price:199,  icon:'🧶', hue:270, sale:true},
  {id:13,name:'Crossbody Bag',    type:'Accessories', gender:'Unisex', price:399,  icon:'👜', hue:20},
  {id:14,name:'Mesh Socks 3-pack',type:'Accessories', gender:'Unisex', price:149,  icon:'🧦', hue:210},
  {id:15,name:'Shadow Puffer',    type:'Clothing',    gender:'Women',  price:1990, icon:'🧥', hue:310},
  {id:16,name:'Storm Shell',      type:'Clothing',    gender:'Men',    price:1490, icon:'🧥', hue:230, sale:true}
];
const GENDERS = ['All','Men','Women','Kids','Sale'];
const TYPES   = ['All','Shoes','Clothing','Accessories'];

/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
const kr = n => n.toLocaleString('sv-SE') + ' kr';
const priceOf = p => p.sale ? Math.round(p.price * 0.7) : p.price;   // sale = 30% off
function sizesFor(p){
  if (p.type === 'Accessories') return ['One size'];
  if (p.type === 'Shoes') return p.gender === 'Kids' ? ['28','30','32','34'] : ['38','39','40','41','42','43','44'];
  return p.gender === 'Kids' ? ['110','128','140'] : ['XS','S','M','L','XL'];
}
function pic(p){
  return '<div class="pic" style="background:linear-gradient(145deg,hsl('+p.hue+' 35% 22%),hsl('+p.hue+' 45% 8%))">'+
         p.icon + (p.sale ? '<span class="tag">Sale −30%</span>' : '') + '</div>';
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.id); toast.id = setTimeout(() => t.style.display = 'none', 2200);
}

/* ============ STAGE 4: CATEGORIES, FILTERS, SEARCH, SORT ============ */
const state = {gender:'All', type:'All', q:'', sort:'new'};

function visible(){
  let list = PRODUCTS.filter(p => {
    if (state.gender === 'Sale' && !p.sale) return false;
    if (['Men','Women','Kids'].includes(state.gender) && p.gender !== state.gender && p.gender !== 'Unisex') return false;
    if (state.type !== 'All' && p.type !== state.type) return false;
    if (state.q && !p.name.toLowerCase().includes(state.q.toLowerCase())) return false;
    return true;
  });
  if (state.sort === 'low')  list.sort((a,b) => priceOf(a) - priceOf(b));
  if (state.sort === 'high') list.sort((a,b) => priceOf(b) - priceOf(a));
  if (state.sort === 'new')  list.sort((a,b) => b.id - a.id);
  return list;
}

function renderNav(){
  $('#nav').innerHTML = GENDERS.map(g =>
    '<button class="'+(g==='Sale'?'sale ':'')+(state.gender===g?'on':'')+'" data-g="'+g+'">'+(g==='All'?'Shop all':g)+'</button>').join('');
  $('#chips').innerHTML = TYPES.map(t =>
    '<button class="'+(state.type===t?'on':'')+'" data-t="'+t+'">'+t+'</button>').join('');
}
function renderGrid(){
  const list = visible();
  $('#grid').innerHTML = list.length ? list.map(p =>
    '<button class="card" data-id="'+p.id+'">'+pic(p)+
    '<div class="info"><b>'+p.name+'</b><small>'+p.gender+' · '+p.type+'</small><br>'+
    kr(priceOf(p))+(p.sale?'<span class="was">'+kr(p.price)+'</span>':'')+'</div></button>').join('')
    : '<div class="empty">No products match. Clear the search or pick another category.</div>';
}
function refresh(){ renderNav(); renderGrid(); }

$('#nav').onclick  = e => { const g = e.target.dataset.g; if (g){ state.gender = g; refresh(); } };
$('#chips').onclick = e => { const t = e.target.dataset.t; if (t){ state.type = t; refresh(); } };
$('#q').oninput    = e => { state.q = e.target.value; renderGrid(); };
$('#sort').onchange = e => { state.sort = e.target.value; renderGrid(); };
$('#grid').onclick = e => { const c = e.target.closest('.card'); if (c) openProduct(+c.dataset.id); };

/* ============ STAGE 5: PRODUCT PAGE (MODAL) + SIZE PICKER ============ */
let chosenSize = null;
function openProduct(id){
  const p = PRODUCTS.find(x => x.id === id); chosenSize = null;
  $('#modal').innerHTML = pic(p) +
    '<h2 style="font-size:32px;margin-top:14px">'+p.name+'</h2>'+
    '<div>'+kr(priceOf(p))+(p.sale?'<span class="was">'+kr(p.price)+'</span>':'')+'</div>'+
    '<p style="color:var(--mute)">Pick your size</p>'+
    '<div class="sizes">'+sizesFor(p).map(s => '<button data-s="'+s+'">'+s+'</button>').join('')+'</div>'+
    '<button class="pay" id="add">Add to cart</button>';
  $('#modal .sizes').onclick = e => {
    if (!e.target.dataset.s) return;
    chosenSize = e.target.dataset.s;
    document.querySelectorAll('.sizes button').forEach(b => b.classList.toggle('on', b === e.target));
  };
  $('#add').onclick = () => {
    if (!chosenSize) return toast('Pick a size first');
    addToCart(p.id, chosenSize); closeAll(); toast(p.name + ' added to cart');
  };
  $('#veil').classList.add('open'); $('#modal').classList.add('open');
}

/* ============ STAGE 6: CART SAVED IN THE BROWSER ============ */
let cart = [];
try { cart = JSON.parse(localStorage.getItem('vanta9-cart') || '[]'); } catch (e) {}
const saveCart = () => { try { localStorage.setItem('vanta9-cart', JSON.stringify(cart)); } catch (e) {} };

function addToCart(id, size){
  const hit = cart.find(i => i.id === id && i.size === size);
  hit ? hit.qty++ : cart.push({id, size, qty:1});
  saveCart(); renderCart();
}
function changeQty(i, d){
  cart[i].qty += d;
  if (cart[i].qty <= 0) cart.splice(i, 1);
  saveCart(); renderCart();
}
function renderCart(){
  $('#count').textContent = cart.reduce((n, i) => n + i.qty, 0);
  const total = cart.reduce((n, i) => n + priceOf(PRODUCTS.find(p => p.id === i.id)) * i.qty, 0);
  $('#drawer').innerHTML = '<h2 style="font-size:30px;margin-bottom:8px">Your cart</h2>' +
    (cart.length ? cart.map((i, k) => {
      const p = PRODUCTS.find(x => x.id === i.id);
      return '<div class="line"><div class="t"><b>'+p.name+'</b><br><small>Size '+i.size+' · '+kr(priceOf(p))+'</small></div>'+
        '<div class="qty"><button data-k="'+k+'" data-d="-1" aria-label="Remove one">−</button> '+i.qty+
        ' <button data-k="'+k+'" data-d="1" aria-label="Add one">+</button></div></div>';
    }).join('') + '<div class="total"><span>Total</span><b>'+kr(total)+'</b></div><button class="pay" id="checkout">Checkout</button>'
    : '<p style="color:var(--mute)">Your cart is empty. Pick something from the shop.</p>') +
    '<button class="icon" style="margin-top:14px" id="closeCart">Close</button>';
  const co = $('#checkout'); if (co) co.onclick = () => toast('Checkout is Stage 7: we connect Stripe test mode next.');
  $('#closeCart').onclick = closeAll;
}
$('#drawer').onclick = e => { if (e.target.dataset.k) changeQty(+e.target.dataset.k, +e.target.dataset.d); };
$('#openCart').onclick = () => { $('#veil').classList.add('open'); $('#drawer').classList.add('open'); };

function closeAll(){ document.querySelectorAll('.open').forEach(el => el.classList.remove('open')); }
$('#veil').onclick = closeAll;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

/* ============ START ============ */
refresh(); renderCart();
</script>
</body>
</html>
